query TasksByBoard(
  $boardId: ID!
  $query: String
  $statusIds: [ID!]
  $priority: [TaskPriority!]
  $assigneeId: ID
  $labelIds: [ID!]
  $dueFilter: DueFilter
  $sortBy: TaskSortBy
  $sortOrder: SortOrder
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  tasksByBoard(
    boardId: $boardId
    query: $query
    statusIds: $statusIds
    priority: $priority
    assigneeId: $assigneeId
    labelIds: $labelIds
    dueFilter: $dueFilter
    sortBy: $sortBy
    sortOrder: $sortOrder
    first: $first
    after: $after
    last: $last
    before: $before
  ) {
    edges {
      node {
        id
        columnId
        title
        description
        priority
        dueDate
        assigneeId
        position
        statusId
        labelIds
        createdAt
        updatedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}

